<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="theme-color" content="#111317">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Gym</title>
<style>
:root{--bg:#111317;--card:#1b1e24;--card2:#23272f;--txt:#eef0f3;--mut:#9aa3ae;--acc:#ff8a3d;--ok:#3ecf8e;--line:#2d323b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden;margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
main{padding:12px 16px 90px;max-width:640px;margin:0 auto}
h1{font-size:22px;margin:6px 0 2px}
h2{font-size:17px;margin:18px 0 8px}
.sub{color:var(--mut);font-size:14px}
.pill{display:inline-block;background:var(--card2);color:var(--acc);border-radius:99px;padding:2px 10px;font-size:13px;margin:6px 6px 0 0}
.note{background:#2a2117;border-left:3px solid var(--acc);padding:8px 10px;border-radius:8px;font-size:14px;margin:10px 0}
.card{background:var(--card);border-radius:14px;padding:12px;margin:10px 0}
.exh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.exh b{font-size:16px}
.tgt{color:var(--acc);font-weight:600;white-space:nowrap}
.last{color:var(--mut);font-size:13px;margin:2px 0 8px}
.set{display:grid;grid-template-columns:26px 1fr 1fr auto;gap:8px;align-items:center;margin:6px 0}
.set.nw{grid-template-columns:26px 1fr auto}
.set .n{color:var(--mut);text-align:center}
.fld{position:relative}
.fld span{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--mut);font-size:13px;pointer-events:none}
input,select,textarea{width:100%;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:17px;font-family:inherit}
textarea{font-size:14px;min-height:70px}
.chk{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--mut);font-size:20px}
.chks{display:flex;gap:6px}
.chk{width:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;padding:0}
.chk.two{width:46px}.chk small{font-size:10px;margin-top:3px;opacity:.85}
.chk.run{background:var(--acc);color:#1a0d02;border-color:var(--acc)}
.setbtns{display:flex;justify-content:space-between}
.mini:disabled{opacity:.35}
#timer.work{background:var(--ok)}
.tw{flex:1;display:flex;flex-direction:column;min-width:0}
.tw small{font-size:12px;font-weight:600;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg{display:flex;gap:10px;align-items:center;color:var(--txt);font-size:15px;margin:12px 0}
.tg input{width:22px;height:22px;flex:none;accent-color:var(--acc)}
.rest{margin:0 0 6px!important}
.chk.on{background:var(--ok);color:#06210f;border-color:var(--ok)}
button{font-family:inherit}
.btn{background:var(--acc);color:#1a0d02;border:0;border-radius:12px;padding:12px 14px;font-size:16px;font-weight:600;width:100%;margin-top:8px}
.btn.sec{background:var(--card2);color:var(--txt)}
.row{display:flex;gap:8px}
.row>*{flex:1}
.mini{background:none;border:0;color:var(--acc);font-size:14px;padding:6px 0}
nav{position:fixed;left:0;right:0;bottom:0;background:#0c0d10;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:10px 0 12px;font-size:12px}
nav button i{display:block;font-style:normal;font-size:20px}
nav button.on{color:var(--acc)}
#timer{position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom));background:var(--acc);color:#1a0d02;border-radius:14px;padding:10px 12px;display:none;align-items:center;gap:8px;z-index:6;box-shadow:0 6px 20px #0008}
#timer.show{display:flex}
#timer b{font-size:24px;font-variant-numeric:tabular-nums}
#timer button{background:#0002;border:0;border-radius:8px;padding:8px 10px;font-size:15px;color:#1a0d02;font-weight:600}
.weeknav{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.weeknav button{background:var(--card2);color:var(--txt);border:0;border-radius:10px;width:44px;height:40px;font-size:18px}
.day{cursor:pointer}
.day small{color:var(--mut)}
.done{color:var(--ok);font-size:13px}
.list li{margin:2px 0;color:#cfd4da;font-size:14px}
.list{padding-left:18px;margin:6px 0 0}
canvas{width:100%;height:200px;background:var(--card2);border-radius:10px}
.hist{display:flex;justify-content:space-between;font-size:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.rth{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;color:var(--txt);padding:2px 0;font-size:16px;text-align:left}
.rth .ok{color:var(--ok)}
.rti{display:flex;gap:10px;align-items:center;width:100%;background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:10px;margin:6px 0;font-size:15px;text-align:left}
.rti i{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);font-style:normal;font-size:13px;display:flex;align-items:center;justify-content:center;color:transparent}
.rti.on{opacity:.6}.rti.on i{background:var(--ok);border-color:var(--ok);color:#06210f}.rti.on span{text-decoration:line-through}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;margin:8px 0 4px;gap:3px}
.seg button{flex:1;background:none;border:0;border-radius:8px;color:var(--mut);padding:7px 4px;font-size:14px}
.seg button.on{background:#3a3f4a;color:var(--txt);font-weight:600}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0 6px}
.meta .last{margin:0}
.rest{display:flex;align-items:center;gap:4px;margin:0;color:var(--mut);font-size:13px;white-space:nowrap}
.rest input{width:58px;padding:5px 6px;font-size:15px;text-align:center}
input.auto{color:var(--mut);font-style:italic}
.altn{border-top:1px solid var(--line);padding-top:6px}
.info{background:none;border:0;color:var(--acc);font-size:18px;padding:0 4px;vertical-align:-1px}
.desc{background:var(--card2);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px;color:#d6dbe1}
.desc p{margin:6px 0}.desc ul{margin:6px 0;padding-left:18px}.desc li{margin:2px 0}
.desc .mus{color:var(--acc);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.desc .err{color:#ffb4a0}.desc a{color:var(--acc);text-decoration:none;font-weight:600;display:inline-block;margin-top:4px}
label{display:block;color:var(--mut);font-size:13px;margin:10px 0 4px}
</style>
</head>
<body>
<main id="app"></main>
<div id="timer"><div class="tw"><small id="tl">Descanso</small><b id="tt">0:00</b></div><button data-t="-15">−15</button><button data-t="15">+15</button><button data-t="x">✕</button></div>
<nav id="nav">
  <button data-tab="hoy"><i>🏋️</i>Sesión</button>
  <button data-tab="plan"><i>📅</i>Plan</button>
  <button data-tab="hist"><i>📈</i>Progreso</button>
  <button data-tab="ajustes"><i>⚙️</i>Ajustes</button>
</nav>
<script>
/* ===== Ejercicios ===== */
const EX={
 goblet:['Sentadilla goblet',1,90], remo_mb:['Remo con mancuerna',1,75], press_mil_mb:['Press militar mancuernas (sentado)',1,90],
 puente:['Puente de glúteo',1,60], facepull:['Face pull en polea',1,60], plancha:['Plancha frontal',0,45],
 pmr_mb:['Peso muerto rumano (mancuernas)',1,90], jalon:['Jalón al pecho',1,90], press_banca_mb:['Press banca mancuernas',1,90],
 laterales:['Elevaciones laterales',1,60], talones:['Elevación de talones de pie',1,45], pallof:['Press Pallof',1,45],
 zancada_inv:['Zancada inversa',1,75], remo_polea:['Remo sentado en polea',1,75], arnold:['Press Arnold',1,75],
 stepup:['Step-up a cajón',1,75], rot_ext:['Rotación externa (banda/polea)',1,45], birddog:['Bird dog',0,30],
 sentadilla:['Sentadilla con barra',1,150], pmr:['Peso muerto rumano con barra',1,120], bulgara:['Sentadilla búlgara',1,90],
 plancha_lat:['Plancha lateral',0,30], press_mil:['Press militar de pie (barra)',1,120], dominada:['Dominadas asistidas / jalón',1,120],
 ytw:['Y-T-W en banco inclinado',1,45], hip_thrust:['Hip thrust',1,120], remo_pecho:['Remo con pecho apoyado',1,75],
 press_incl:['Press inclinado mancuernas',1,90], deadbug:['Dead bug',0,30]
};
/* Descripciones: m = músculos, c = cómo se hace, k = claves, x = error típico */
const DESC={
 goblet:{m:'Cuádriceps, glúteo, core',c:'De pie, pies algo más abiertos que la cadera. Sujeta una mancuerna vertical pegada al pecho. Baja sentándote entre los talones hasta que los codos rocen las rodillas y sube empujando el suelo.',k:['Pecho alto y espalda neutra','Rodillas siguen la dirección de los pies','Talones apoyados todo el recorrido'],x:'Dejar que las rodillas se cierren hacia dentro al subir.'},
 remo_mb:{m:'Dorsal, romboides, deltoides posterior',c:'Mano y rodilla del mismo lado apoyadas en un banco, espalda paralela al suelo. Tira de la mancuerna hacia la cadera llevando el codo atrás y bájala controlada hasta estirar el brazo.',k:['Codo pegado al cuerpo, hacia la cadera','Junta la escápula al final','Sin girar el tronco'],x:'Tirar con el bíceps y dar tirones con el cuerpo.'},
 press_mil_mb:{m:'Deltoides, tríceps',c:'Sentado en banco con respaldo vertical. Mancuernas a la altura de los hombros, palmas al frente. Empuja hacia arriba hasta casi extender los codos y baja controlado.',k:['Abdomen apretado, lumbar apoyada','Codos ligeramente por delante del cuerpo','Bajar hasta la altura de las orejas'],x:'Arquear la zona lumbar para mover más peso.'},
 puente:{m:'Glúteo, isquiotibiales',c:'Tumbado boca arriba, rodillas dobladas y pies apoyados cerca de los glúteos. Eleva la cadera apretando glúteos hasta alinear rodillas-cadera-hombros. Pausa 1 s arriba y baja.',k:['Empuja con los talones','Pelvis en retroversión (sin arquear)','Pausa arriba'],x:'Subir de más arqueando la lumbar en lugar de apretar glúteo.'},
 facepull:{m:'Deltoides posterior, manguito rotador, trapecio medio',c:'Polea alta con cuerda. Agarre con pulgares hacia ti. Tira hacia la cara separando las manos, terminando con los codos altos y las manos a la altura de las orejas.',k:['Codos altos, a la altura de los hombros','Rota hacia fuera al final (puños atrás)','Peso ligero, movimiento controlado'],x:'Usar demasiado peso y tirar con la espalda baja.'},
 plancha:{m:'Core (recto y transverso abdominal)',c:'Apoyado en antebrazos y puntas de los pies, cuerpo recto de cabeza a talones. Mantén la posición el tiempo indicado.',k:['Aprieta glúteos y abdomen','Codos bajo los hombros','Respira, no bloquees'],x:'Dejar caer la cadera o subirla en pico.'},
 pmr_mb:{m:'Isquiotibiales, glúteo, erectores',c:'De pie con una mancuerna en cada mano. Rodillas ligeramente flexionadas y fijas. Lleva la cadera atrás deslizando las mancuernas por los muslos hasta notar tensión en isquios y vuelve empujando la cadera al frente.',k:['Movimiento de bisagra: cadera atrás','Espalda neutra todo el recorrido','Mancuernas pegadas a las piernas'],x:'Redondear la espalda o convertirlo en una sentadilla.'},
 jalon:{m:'Dorsal ancho, bíceps',c:'Sentado en máquina con muslos bloqueados. Agarre algo más ancho que hombros. Tira de la barra hacia la parte alta del pecho llevando los codos abajo y atrás. Sube controlado.',k:['Saca pecho e inclina ligeramente el tronco','Baja primero las escápulas','Controla la subida'],x:'Balancearse hacia atrás o bajar la barra tras la nuca.'},
 press_banca_mb:{m:'Pectoral, tríceps, deltoides anterior',c:'Tumbado en banco plano, pies firmes. Mancuernas sobre el pecho. Bájalas a los lados del pecho con codos a ~45° y empuja hasta arriba.',k:['Escápulas juntas y hacia abajo','Codos a 45°, no abiertos a 90°','Bajar hasta notar estiramiento'],x:'Abrir los codos en cruz, que carga el hombro.'},
 laterales:{m:'Deltoides lateral',c:'De pie, mancuernas a los lados. Eleva los brazos lateralmente con codos ligeramente flexionados hasta la altura de los hombros. Baja lento.',k:['Lidera con los codos, no con las manos','Hasta la altura del hombro, no más','Bajada en 2–3 s'],x:'Usar impulso y encoger el trapecio.'},
 talones:{m:'Gemelo, sóleo (clave para correr)',c:'De pie con la parte delantera del pie en un escalón o disco. Baja los talones hasta estirar y sube lo más alto posible. Pausa arriba.',k:['Rango completo: estira abajo','Pausa 1 s arriba','Rodillas casi estiradas'],x:'Rebotar abajo y hacer medio recorrido.'},
 pallof:{m:'Core antirrotación (oblicuos, transverso)',c:'De lado a una polea o banda a la altura del pecho. Sujeta el agarre con ambas manos junto al pecho y estira los brazos al frente resistiendo el giro. Vuelve y repite; luego el otro lado.',k:['Cadera y hombros mirando al frente','Pies a la anchura de la cadera','Movimiento lento'],x:'Dejar que el cable te gire el tronco.'},
 zancada_inv:{m:'Cuádriceps, glúteo, estabilidad',c:'De pie, da un paso largo hacia atrás y baja hasta que la rodilla trasera casi toque el suelo. Vuelve empujando con el pie delantero.',k:['Tronco recto','Peso en el talón delantero','Rodilla delantera alineada con el pie'],x:'Paso demasiado corto, que sobrecarga la rodilla.'},
 remo_polea:{m:'Dorsal, romboides, trapecio medio',c:'Sentado frente a la polea baja, pies apoyados y rodillas algo flexionadas. Tira del agarre hacia el abdomen juntando escápulas y vuelve estirando los brazos sin perder la postura.',k:['Tronco fijo y erguido','Codos pegados al cuerpo','Junta escápulas al final'],x:'Balancear el tronco adelante y atrás.'},
 arnold:{m:'Deltoides (las tres cabezas), tríceps',c:'Sentado, mancuernas frente a la cara con palmas hacia ti. Al empujar hacia arriba rota las muñecas para terminar con palmas al frente. Invierte el giro al bajar.',k:['Rotación fluida durante el recorrido','Abdomen firme','Peso moderado'],x:'Hacer el giro arriba de golpe en vez de durante el movimiento.'},
 stepup:{m:'Cuádriceps, glúteo, equilibrio',c:'Frente a un cajón a la altura de la rodilla. Apoya un pie entero y sube empujando con esa pierna hasta quedarte de pie. Baja controlado con la misma pierna.',k:['La pierna de arriba hace el trabajo','Sin impulsarte con el pie de abajo','Rodilla alineada con el pie'],x:'Saltar con la pierna de abajo.'},
 rot_ext:{m:'Manguito rotador (infraespinoso, redondo menor)',c:'De pie, codo pegado al costado a 90° (una toalla entre codo y cuerpo ayuda). Con banda o polea a la altura del codo, rota el antebrazo hacia fuera y vuelve lento.',k:['Codo fijo pegado al cuerpo','Peso muy ligero','Movimiento lento y controlado'],x:'Separar el codo del cuerpo o usar demasiada carga.'},
 birddog:{m:'Core, glúteo, estabilizadores de la espalda',c:'En cuadrupedia, manos bajo hombros y rodillas bajo cadera. Extiende a la vez brazo y pierna contrarios hasta alinearlos con el tronco. Pausa 2 s y vuelve.',k:['Espalda plana (como una mesa)','Cadera sin girar','Lento, con pausa'],x:'Arquear la lumbar al subir la pierna.'},
 sentadilla:{m:'Cuádriceps, glúteo, aductores, core',c:'Barra apoyada sobre los trapecios. Pies a la anchura de los hombros. Inspira, aprieta el abdomen y baja llevando cadera atrás y abajo hasta al menos la paralela. Sube empujando el suelo.',k:['Respira y bloquea el core antes de bajar','Rodillas en la dirección de los pies','Mirada al frente, espalda neutra'],x:'Levantar los talones o redondear la espalda abajo.'},
 pmr:{m:'Isquiotibiales, glúteo, erectores',c:'De pie con la barra en las manos. Rodillas ligeramente flexionadas. Lleva la cadera atrás deslizando la barra pegada a los muslos hasta media tibia o hasta notar tensión en isquios. Vuelve empujando la cadera al frente.',k:['Barra siempre pegada a las piernas','Espalda neutra, hombros atrás','La cadera manda, no la espalda'],x:'Redondear la espalda para bajar más.'},
 bulgara:{m:'Cuádriceps, glúteo, estabilidad (muy útil para correr)',c:'De espaldas a un banco, apoya el empeine del pie trasero en él. Baja flexionando la rodilla delantera hasta que el muslo quede casi paralelo al suelo y sube.',k:['Pie delantero lo bastante adelantado','Tronco algo inclinado = más glúteo','Baja controlado'],x:'Pie delantero demasiado cerca del banco.'},
 plancha_lat:{m:'Oblicuos, glúteo medio',c:'De lado, apoyado en un antebrazo (codo bajo el hombro) y el lateral del pie. Eleva la cadera hasta alinear el cuerpo y mantén.',k:['Cuerpo en línea recta','Cadera alta, sin hundirla','Hombro lejos de la oreja'],x:'Dejar caer la cadera.'},
 press_mil:{m:'Deltoides, tríceps, core',c:'De pie, barra apoyada en la parte alta del pecho, agarre algo más ancho que hombros. Empuja la barra en vertical apartando la cabeza y métela bajo la barra al final.',k:['Glúteos y abdomen apretados','Antebrazos verticales','La barra sube en línea recta'],x:'Arquear la espalda hacia atrás.'},
 dominada:{m:'Dorsal ancho, bíceps, core',c:'Colgado de la barra (con banda o máquina asistida si hace falta). Tira llevando el pecho hacia la barra hasta pasar la barbilla. Baja controlado hasta estirar los brazos. Si no tienes asistencia, haz jalón al pecho.',k:['Baja primero las escápulas','Sin balanceos','Rango completo'],x:'Medias repeticiones sin estirar abajo.'},
 ytw:{m:'Trapecio medio e inferior, deltoides posterior',c:'Boca abajo en banco inclinado (~30°), brazos colgando. Eleva los brazos formando una Y (arriba), luego una T (lateral) y luego una W (codos atrás). Cada letra cuenta como una repetición.',k:['Pulgares hacia arriba','Junta escápulas','Muy poco peso (0–2 kg)'],x:'Usar peso y encoger los hombros.'},
 hip_thrust:{m:'Glúteo, isquiotibiales',c:'Espalda alta apoyada en un banco, barra sobre la cadera (con protector). Pies apoyados a la anchura de las caderas. Eleva la cadera hasta alinear el tronco con los muslos, pausa y baja.',k:['Barbilla al pecho, mirada al frente','Tibias verticales arriba','Aprieta glúteos, sin arquear la lumbar'],x:'Hiperextender la zona lumbar arriba.'},
 remo_pecho:{m:'Dorsal, romboides, deltoides posterior',c:'Pecho apoyado en un banco inclinado o en máquina. Con una mancuerna en cada mano, tira llevando los codos atrás y junta escápulas. Baja controlado.',k:['Pecho pegado al apoyo','Junta escápulas arriba','Sin tirones'],x:'Despegar el pecho del banco para usar impulso.'},
 press_incl:{m:'Pectoral superior, deltoides anterior, tríceps',c:'Banco a 30°. Mancuernas a la altura del pecho alto. Empuja hacia arriba y ligeramente hacia dentro; baja controlado.',k:['Escápulas juntas y hacia abajo','Codos a ~45°','Inclinación baja (30°)'],x:'Banco demasiado inclinado, que lo convierte en press de hombro.'},
 deadbug:{m:'Core profundo (transverso), control lumbopélvico',c:'Boca arriba, brazos al techo y rodillas a 90° sobre la cadera. Extiende a la vez brazo y pierna contrarios hasta casi tocar el suelo y vuelve. Alterna.',k:['Lumbar pegada al suelo en todo momento','Exhala al extender','Lento'],x:'Despegar la lumbar del suelo al extender.'}
};
/* ===== Alternativas en máquina: [nombre, cómo, claves] ===== */
const ALT={
 goblet:['Prensa de piernas','Sentado en la prensa, pies a la anchura de los hombros en el centro de la plataforma. Baja hasta ~90° de rodilla y empuja sin bloquear las rodillas arriba.',['Lumbar pegada al respaldo','No bloquees las rodillas arriba']],
 sentadilla:['Hack squat (o prensa de piernas)','Espalda apoyada en el respaldo y hombros bajo las almohadillas. Pies a la anchura de los hombros. Baja controlado hasta la paralela o algo más y sube empujando con todo el pie.',['Rodillas en la dirección de los pies','Talones apoyados todo el recorrido']],
 bulgara:['Prensa unilateral','Prensa de piernas con una sola pierna, pie centrado en la plataforma. Baja hasta ~90° y empuja. Haz todas las repeticiones de un lado y luego cambia.',['Cadera fija contra el asiento','Rodilla alineada con el pie']],
 zancada_inv:['Prensa unilateral','Prensa de piernas con una sola pierna, pie centrado. Baja hasta ~90° y empuja sin bloquear la rodilla.',['Cadera fija','Recorrido controlado']],
 stepup:['Prensa unilateral','Prensa de piernas con una sola pierna, pie algo alto en la plataforma para implicar más glúteo. Baja hasta ~90° y empuja.',['Cadera fija','Sin bloquear la rodilla']],

 pmr_mb:['Hiperextensión a 45° (banco romano)','Cadera apoyada justo por debajo del borde del cojín. Baja el tronco con la espalda neutra y sube apretando glúteos hasta alinear el cuerpo.',['Bisagra de cadera','No hiperextiendas arriba']],

function phase(w){
 if(w<=2) return {fb:true,label:'Readaptación · full body',bw:w};
 const b=Math.floor((w-3)/4)+1, bw=(w-3)%4+1, type=b%2?'base':'fuerza';
 return {fb:false,b,bw,type,label:`Bloque ${b} · ${type==='base'?'Base':'Fuerza'} · sem ${bw}/4`};
}
function session(w,d){
 const p=phase(w);
 if(d==='mie'){
  const r=p.fb?RUN.fb[w-1]:RUN.blk[p.bw-1];
  return {run:true,t:'Carrera',desc:r,p,rt:'run'};
 }
 if(p.fb){
  const s=FB[d];
  return {t:s.t,p,rt:'fb',note:w===1?'Cargas cómodas: prioriza técnica y rango de movimiento.':'Sube un poco la carga donde la semana pasada te sobró margen.',
   items:s.items.map(([id,sets,r])=>mk(id,sets,r))};
 }
 const s=BLK[d], dl=p.bw===4;
 return {t:s.t,p,rt:{lun:'leg',mar:'up',jue:'fb'}[d],note:BWNOTE[p.bw-1],
  items:s.items.map(it=>{
   const [id,k]=it;
   if(k==='m'){const [sets,r]=MAIN[p.type][p.bw-1];return mk(id,sets,r,true)}
   if(k==='a'){const [sets,r]=ACC[p.bw-1];return mk(id,sets,it[2]||r)}
   return mk(id,dl?Math.min(2,it[2]):it[2],it[3]);
  })};
}
function mk(id,s,r,main){
 const eid=(S.alt[id]&&ALT[id])?id+'_maq':id, e=EX[eid], def=main?Math.max(e[2],150):e[2];
 return {id:eid,base:id,name:e[0],w:!!e[1],def,rest:S.rest[eid]||def,s,r,main};
}

function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parse(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function mondayOf(d){d=new Date(d.getFullYear(),d.getMonth(),d.getDate());const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return iso(d)}
function dateFor(w,d){const x=parse(S.start);x.setDate(x.getDate()+(w-1)*7+DAYS.find(z=>z.k===d).o);return x}
function fmt(d){return d.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'})}
function todaySel(){
 const t=new Date(),st=parse(S.start);
 let w=Math.floor((new Date(t.getFullYear(),t.getMonth(),t.getDate())-st)/864e5/7)+1;
 if(w<1) return {w:1,d:'lun'};
 const dow=(t.getDay()+6)%7; // 0=lunes
 if(dow<=3) return {w,d:DAYS[dow].k};
 return {w:w+1,d:'lun'};
}

function getLog(k,create){if(!S.logs[k]&&create)S.logs[k]={sets:{},note:''};return S.logs[k]}

function lastFor(exId,curK){
 let best=null;
 for(const [k,l] of Object.entries(S.logs)){
  if(k===curK||!l.sets||!l.sets[exId]) continue;
  const done=l.sets[exId].filter(x=>x&&x.d);
  if(!done.length) continue;
  const ts=l.ts||0;
  if(!best||ts>best.ts) best={ts,sets:done,date:l.date};
 }
 return best;
}
function topW(sets){let m=null;for(const s of sets){const v=parseFloat(String(s.w).replace(',','.'));if(!isNaN(v)&&(m===null||v>m))m=v}return m}

  h+=`<label>Ejercicio</label><select data-hx>${ids.map(i=>`<option value="${i}" ${i===histEx?'selected':''}>${EX[i][0]}</option>`).join('')}</select>
  <p class="sub">Carga máxima por sesión (kg)</p><canvas id="cv"></canvas>`;
 }else h+=`<p class="sub">Aún no hay series con peso registradas.</p>`;
 const ent=Object.entries(S.logs).filter(([k,l])=>l.fin||l.km||(l.sets&&Object.values(l.sets).some(a=>a.some(x=>x&&x.d)))).sort((a,b)=>(b[1].ts||0)-(a[1].ts||0));
 h+=`<h2>Sesiones</h2>`;
 if(!ent.length)h+=`<p class="sub">Sin sesiones registradas.</p>`;
 for(const [k,l] of ent.slice(0,60)){
  const [w,d]=k.split('-'), s=session(+w,d);
  const info=s.run?((l.km?l.km+' km':'')+(l.min?' · '+l.min+' min':'')):(Object.values(l.sets||{}).reduce((a,x)=>a+x.filter(y=>y&&y.d).length,0)+' series');
  h+=`<div class="hist day" data-go="${w}|${d}"><span>S${w} ${DAYS.find(z=>z.k===d).n.slice(0,3)} · ${s.t}</span><span class="sub">${info}</span></div>`;
 }
 app.innerHTML=h;
 if(histEx)drawChart(histEx);
}
function drawChart(id){
 const pts=[];for(const l of Object.values(S.logs)){if(!l.sets||!l.sets[id])continue;const m=topW(l.sets[id].filter(x=>x&&x.d));if(m!==null)pts.push([l.ts||0,m])}
 pts.sort((a,b)=>a[0]-b[0]);
 const cv=document.getElementById('cv'),r=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;cv.width=W*r;cv.height=H*r;
 const c=cv.getContext('2d');c.scale(r,r);c.font='12px -apple-system,sans-serif';
 if(!pts.length)return;
 const ys=pts.map(p=>p[1]),mn=Math.min(...ys),mx=Math.max(...ys),pad=mx===mn?5:(mx-mn)*.15,lo=mn-pad,hi=mx+pad;
 const X=i=>pts.length===1?W/2:28+i*(W-44)/(pts.length-1),Y=v=>H-24-(v-lo)/(hi-lo)*(H-44);
 c.strokeStyle='#2d323b';c.fillStyle='#9aa3ae';
 for(let i=0;i<=3;i++){const v=lo+(hi-lo)*i/3,y=Y(v);c.beginPath();c.moveTo(24,y);c.lineTo(W-8,y);c.stroke();c.fillText(Math.round(v),2,y+4)}
 c.strokeStyle='#ff8a3d';c.lineWidth=2.5;c.beginPath();pts.forEach((p,i)=>i?c.lineTo(X(i),Y(p[1])):c.moveTo(X(i),Y(p[1])));c.stroke();
 c.fillStyle='#ff8a3d';pts.forEach((p,i)=>{c.beginPath();c.arc(X(i),Y(p[1]),4,0,7);c.fill()});
 c.fillStyle='#eef0f3';const L=pts[pts.length-1];c.fillText(L[1]+' kg',Math.min(X(pts.length-1)-20,W-50),Y(L[1])-10);
}
function vAjustes(){
 app.innerHTML=`<h1>Ajustes</h1>
 <label>Fecha de inicio del plan (se ajusta al lunes de esa semana)</label><input type="date" data-start value="${S.start}">
 <p class="sub">Semana actual: ${todaySel().w}</p>
 <h2>Sonido</h2>
 <label class="tg"><input type="checkbox" data-snd ${S.snd===false?'':'checked'}> Sonido al terminar los contadores</label>
 <label class="tg"><input type="checkbox" data-loud ${S.loud?'checked':''}> Sonar aunque el iPhone esté en silencio <span class="sub">(puede pausar tu música)</span></label>
 <button class="btn sec" data-test>🔔 Probar sonido</button>
 <p class="sub">Con la pantalla bloqueada iOS no deja sonar a una web app: mientras corre un contador la app intenta mantener la pantalla encendida.</p>
 <h2>Copia de seguridad</h2>
 <p class="sub">Los datos solo viven en este iPhone. Exporta de vez en cuando y guarda el archivo en iCloud Drive.</p>
 <button class="btn" data-exp>Exportar datos</button>
 <label>Importar (pega el contenido JSON o elige el archivo)</label>
 <input type="file" accept=".json,application/json" data-impf>
 <textarea data-impt placeholder='{"start":...}'></textarea>
 <button class="btn sec" data-imp>Importar texto pegado</button>
 <h2>Zona peligrosa</h2>
 <button class="btn sec" data-reset style="color:#ff6b6b">Borrar todos los datos</button>
 <p class="sub" style="margin-top:16px">Versión 1.4</p>`;
}

/* ===== Eventos ===== */
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.tab;if(tab==='hoy')sel=sel||todaySel();render()});
app.addEventListener('input',e=>{
 const t=e.target,k=key(sel.w,sel.d);
 if(t.dataset.restin){const v=parseInt(t.value);if(v>0)S.rest[t.dataset.restin]=v;else delete S.rest[t.dataset.restin];save();return}
 if(t.dataset.ex){
  const l=getLog(k,true);l.date=l.date||iso(dateFor(sel.w,sel.d));const a=l.sets[t.dataset.ex]||(l.sets[t.dataset.ex]=[]);const i=+t.dataset.i;a[i]=a[i]||{};a[i][t.dataset.f]=t.value;touch(l);save();
  t.classList.remove('auto');
  // El peso de la 1ª serie se propaga a las demás que sigan en automático
  if(i===0&&t.dataset.f==='w')t.closest('.card').querySelectorAll('input.auto[data-f="w"]').forEach(x=>{x.value=t.value||x.dataset.auto});
 }
 else if(t.dataset.run){const l=getLog(k,true);l[t.dataset.run]=t.value.replace(',','.');touch(l);save();if(t.dataset.run!=='rpe'){const p=t.closest('.card').querySelector('input[disabled]');const km=+l.km,mi=+l.min;if(km>0&&mi>0){const q=mi/km,m=Math.floor(q);p.value=m+':'+String(Math.round((q-m)*60)).padStart(2,'0')+' min/km'}}}
 else if('note' in t.dataset){const l=getLog(k,true);l.note=t.value;save()}
});
function touch(l){if(!l.ts)l.ts=dateFor(sel.w,sel.d).getTime()+43200000}
app.addEventListener('change',e=>{
 const t=e.target;
 if('start' in t.dataset&&t.value){S.start=mondayOf(parse(t.value));save();sel=todaySel();planW=sel.w;render()}
 if('hx' in t.dataset){histEx=t.value;vHist()}
 if('snd' in t.dataset){S.snd=t.checked;save()}
 if('loud' in t.dataset){S.loud=t.checked;save();setAudioSession()}
 if('impf' in t.dataset&&t.files[0]){t.files[0].text().then(doImport)}
});
app.addEventListener('click',e=>{
 const b=e.target.closest('[data-test],[data-side],[data-rm],[data-alt],[data-rt],[data-rti],[data-info],[data-exlist],[data-back],[data-chk],[data-add],[data-nav],[data-pw],[data-go],[data-fin],[data-exp],[data-imp],[data-reset]');if(!b)return;
 if(b.dataset.rt){const body=b.nextElementSibling;body.hidden=!body.hidden;rtOpen[b.dataset.rt]=!body.hidden;b.lastElementChild.textContent=body.hidden?'▾':'▴';return}
 if(b.dataset.rti){
  unlockAudio();
  const kind=b.dataset.rti,i=+b.dataset.i,l=getLog(key(sel.w,sel.d),true),st=l[kind]||(l[kind]={});
  st[i]=!st[i];b.classList.toggle('on',st[i]);save();
  const card=b.closest('.rt'),tot=card.querySelectorAll('.rti').length,n=card.querySelectorAll('.rti.on').length,c=card.querySelector('.rth b span');
  c.textContent=n+'/'+tot;c.className=n===tot?'ok':'sub';
  if(st[i]&&+b.dataset.s)startTimer(+b.dataset.s);
  return;
 }
 if(b.dataset.alt){const y=scrollY;S.alt[b.dataset.alt]=b.dataset.v==='1';save();vHoy();scrollTo(0,y);return}
 if(b.dataset.info){e.stopPropagation();const id=b.dataset.info,el=b.closest('.card').querySelector('.desc');if(!el)return;el.hidden=!el.hidden;el.hidden?open.delete(id):open.add(id);return}
 if('exlist' in b.dataset){vEx();window.scrollTo(0,0);return}
 if('back' in b.dataset){vPlan();window.scrollTo(0,0);return}
 const k=key(sel.w,sel.d);
 if('test' in b.dataset){unlockAudio();play('end');return}
 if(b.dataset.side!==undefined&&b.closest('.chks')){
  const c=b.closest('.chks'),eid=c.dataset.ex,i=+c.dataset.i,sd=b.dataset.side,timed=c.dataset.timed==='1';
  const x=getSet(eid,i);
  const done=c.dataset.sides==='1'?!!(x.sd&&x.sd[sd]):!!x.d;
  if(work&&work.match(sd,eid,i)){stopWork();return}           // parar contador en marcha
  if(done){setSide(c,sd,false);return}                         // desmarcar
  if(timed){const ri=c.closest('.set').querySelector('[data-f="r"]');startWork(c,sd,parseInt(ri.value)||parseInt(c.dataset.tr)||30);return}
  setSide(c,sd,true);return;
 }
 if(b.dataset.add||b.dataset.rm){
  const id=b.dataset.add||b.dataset.rm,l=getLog(k,true),n=+b.dataset.n;l.n=l.n||{};
  if(b.dataset.add)l.n[id]=n+1;
  else{if(n<=1)return;const a=l.sets[id]||[];if(a[n-1]&&a[n-1].d&&!confirm('La última serie está completada. ¿Quitarla?'))return;l.n[id]=n-1;a.length=Math.min(a.length,n-1)}
  touch(l);save();const y=scrollY;vHoy();scrollTo(0,y);return;
 }
 if(b.dataset.nav){const idx=DAYS.findIndex(z=>z.k===sel.d)+(+b.dataset.nav);if(idx<0){if(sel.w>1)sel={w:sel.w-1,d:'jue'}}else if(idx>3)sel={w:sel.w+1,d:'lun'};else sel={w:sel.w,d:DAYS[idx].k};vHoy();return}
 if(b.dataset.pw){planW=Math.max(1,planW+(+b.dataset.pw));vPlan();return}
 if(b.dataset.go){const [w,d]=b.dataset.go.split('|');sel={w:+w,d};tab='hoy';render();return}
 if('fin' in b.dataset){const l=getLog(k,true);l.fin=!l.fin;l.date=l.date||iso(dateFor(sel.w,sel.d));touch(l);save();if(l.fin)stopTimer();vHoy();return}
 if('exp' in b.dataset){doExport();return}
 if('imp' in b.dataset){doImport(app.querySelector('[data-impt]').value);return}
 if('reset' in b.dataset){if(confirm('¿Borrar TODOS los registros? No se puede deshacer.')){S={start:S.start,logs:{}};norm();save();render()}}
});
async function doExport(){
 const txt=JSON.stringify(S),name='gym-backup-'+iso(new Date())+'.json';
 try{const f=new File([txt],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e.name==='AbortError')return}
 try{await navigator.clipboard.writeText(txt);alert('Datos copiados al portapapeles. Pégalos en Notas o en un archivo para guardarlos.')}
 catch(e){const t=app.querySelector('[data-impt]');t.value=txt;t.select();alert('Copia el texto del recuadro para guardarlo.')}
}
function doImport(txt){
 try{const d=JSON.parse(txt);if(!d||!d.logs||!d.start)throw 0;if(!confirm('Esto sustituirá los datos actuales. ¿Continuar?'))return;S=d;norm();save();sel=todaySel();planW=sel.w;alert('Importado correctamente.');render()}
 catch(e){alert('El contenido no es una copia válida.')}
}

function getSet(eid,i){const l=getLog(key(sel.w,sel.d),true);l.date=l.date||iso(dateFor(sel.w,sel.d));touch(l);const a=l.sets[eid]||(l.sets[eid]=[]);return a[i]||(a[i]={})}
function setSide(c,sd,val){
 const eid=c.dataset.ex,i=+c.dataset.i,sides=c.dataset.sides==='1',x=getSet(eid,i),was=!!x.d;
 if(sides){x.sd=x.sd||{};x.sd[sd]=val;x.d=!!(x.sd.I&&x.sd.D)}else x.d=val;
 const row=c.closest('.set');
 if(x.d&&!was){
  const wi=row&&row.querySelector('[data-f="w"]');if(wi&&wi.value){x.w=wi.value;wi.classList.remove('auto')}
  const ri=row&&row.querySelector('[data-f="r"]');if(!x.r&&c.dataset.tr){x.r=c.dataset.tr;if(ri)ri.value=x.r}
  const rs=c.closest('.card').querySelector('[data-restin]');startTimer(parseInt(rs&&rs.value)||90,'Descanso');
 }
 save();c.innerHTML=chkHTML(x,sides,c.dataset.timed==='1');
}
function findChks(eid,i){return app.querySelector(`.chks[data-ex="${eid}"][data-i="${i}"]`)}

/* ===== Sonido ===== */
let actx=null;
function setAudioSession(){try{if(navigator.audioSession)navigator.audioSession.type=S.loud?'playback':'transient'}catch(e){}}
function unlockAudio(){try{setAudioSession();if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state!=='running')actx.resume();
 const b=actx.createBuffer(1,1,22050),src=actx.createBufferSource();src.buffer=b;src.connect(actx.destination);src.start(0)}catch(e){}}
function tone(f,start,dur,vol){const o=actx.createOscillator(),g=actx.createGain();o.type='square';o.frequency.value=f;o.connect(g);g.connect(actx.destination);
 const t=actx.currentTime+start;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.setValueAtTime(vol,t+dur-.03);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.start(t);o.stop(t+dur+.02)}
function play(kind){
 if(S.snd===false)return;
 try{unlockAudio();
  if(kind==='pip')tone(1000,0,.08,.35);
  else if(kind==='end'){tone(880,0,.15,.6);tone(880,.22,.15,.6);tone(1320,.44,.45,.7)}
  else if(kind==='side'){tone(660,0,.2,.6);tone(990,.25,.35,.7)}
 }catch(e){}
 if(navigator.vibrate)navigator.vibrate(kind==='pip'?60:[200,100,200]);
}
// Pantalla encendida mientras corre un contador (si iOS lo permite)
let wl=null;async function keepAwake(){try{if('wakeLock' in navigator&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>wl=null)}}catch(e){}}
function releaseAwake(){try{wl&&wl.release()}catch(e){}wl=null}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&TB.classList.contains('show'))keepAwake()});
document.addEventListener('pointerdown',unlockAudio,{passive:true});

/* ===== Contadores: descanso y tiempo de trabajo ===== */
const TB=document.getElementById('timer'),TT=document.getElementById('tt'),TL=document.getElementById('tl');let tEnd=0,tInt=null,tKind='',lastPip=null,work=null;
function startTimer(sec,label,kind){stopWork(true);tKind=kind||'rest';tEnd=Date.now()+sec*1000;lastPip=null;TL.textContent=label||'Descanso';TB.classList.toggle('work',tKind==='work');TB.classList.add('show');clearInterval(tInt);tick();tInt=setInterval(tick,200);keepAwake()}
function stopTimer(){clearInterval(tInt);TB.classList.remove('show');if(tKind==='work'){const w=work;work=null;if(w){const c=findChks(w.eid,w.i);if(c)c.innerHTML=chkHTML(getSet(w.eid,w.i),c.dataset.sides==='1',true)}}tKind='';releaseAwake()}
function startWork(c,sd,sec){
 const eid=c.dataset.ex,i=+c.dataset.i,lab=sd==='I'?' · Izquierdo':sd==='D'?' · Derecho':'';
 startTimer(sec,c.dataset.name+lab,'work');
 work={eid,i,sd,match:(s2,e2,i2)=>s2===sd&&(e2===undefined||(e2===eid&&i2===i))};
 c.innerHTML=chkHTML(getSet(eid,i),c.dataset.sides==='1',true);
}
function stopWork(silent){if(tKind==='work'&&!silent)return stopTimer();if(tKind==='work'){const w=work;work=null;tKind='';if(w){const c=findChks(w.eid,w.i);if(c)c.innerHTML=chkHTML(getSet(w.eid,w.i),c.dataset.sides==='1',true)}}}
function tick(){
 const r=Math.ceil((tEnd-Date.now())/1000);
 if(r<=0){
  clearInterval(tInt);
  if(tKind==='work'){
   const w=work;work=null;tKind='';
   const c=w&&findChks(w.eid,w.i);
   const sides=c&&c.dataset.sides==='1',x=w&&getSet(w.eid,w.i),other=w&&(w.sd==='I'?'D':'I');
   const last=!sides||(x.sd&&x.sd[other]);
   play(last?'end':'side');
   if(c)setSide(c,w.sd,true); else if(w){x.sd=x.sd||{};if(sides)x.sd[w.sd]=true;x.d=!sides||!!(x.sd.I&&x.sd.D);save()}
   if(!last||!c){TT.textContent='¡Cambia de lado!';setTimeout(()=>{if(!tKind)TB.classList.remove('show')},3000);releaseAwake()}
   return;
  }
  TT.textContent='¡A por la siguiente!';play('end');tKind='';releaseAwake();
  setTimeout(()=>{if(!tKind)TB.classList.remove('show')},4000);return;
 }
 if(r<=3&&r!==lastPip){lastPip=r;play('pip')}
 TT.textContent=Math.floor(r/60)+':'+String(r%60).padStart(2,'0');
}
TB.addEventListener('click',e=>{const t=e.target.dataset.t;if(!t)return;if(t==='x')return stopTimer();tEnd+=(+t)*1000;if(tEnd-Date.now()>3500)lastPip=null;tick()});

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script>
